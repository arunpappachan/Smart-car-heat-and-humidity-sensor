# ==============================================================================
# Render.com Deployment Blueprint (Infrastructure as Code)
# Project: Smart Car Heat and Humidity Monitoring System Using ESP32
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # 1. Managed PostgreSQL Database (Render Free Tier)
  # ----------------------------------------------------------------------------
  - name: smart-car-postgres
    databaseName: smart_car_iot
    user: smart_car_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------------------------------
  # 2. Node.js + Express + Socket.IO Backend API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-car-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-car-postgres
          property: connectionString
      - key: DEVICE_API_KEY
        value: smart-car-secret-key-2026
      - key: TEMP_NORMAL_THRESHOLD
        value: "30.0"
      - key: TEMP_HIGH_THRESHOLD
        value: "35.0"
      - key: OFFLINE_TIMEOUT_SECONDS
        value: "20"
      - key: ENABLE_SIMULATION
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

  # ----------------------------------------------------------------------------
  # 3. React.js Frontend Static Site Dashboard
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-car-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smart-car-backend.onrender.com
      - key: VITE_SOCKET_URL
        value: https://smart-car-backend.onrender.com
